services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sitetrack
      POSTGRES_PASSWORD: sitetrack
      POSTGRES_DB: sitetrack
    ports:
      - "5433:5432" # 5433 on your machine, so it won't clash with a local Postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitetrack -d sitetrack"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://sitetrack:sitetrack@db:5432/sitetrack
      JWT_SECRET: change-me-in-production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy # wait until Postgres accepts connections

volumes:
  db-data:
